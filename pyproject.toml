[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-asset-extractor"
version = "0.2.0"
description = "Extract multiple transparent PNG assets from one image"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
image-asset-extractor = "image_asset_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_asset_extractor = ["frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
